name: Build and deploy grammar library

on:
  push:
    branches: [main]
    paths: ["website/**", "src/**", "scripts/build_site.py", "scripts/publish_snapshot.py", "schemas/**", "pyproject.toml", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["website/**", "src/**", "scripts/build_site.py", "scripts/publish_snapshot.py", "schemas/**", "pyproject.toml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grammar-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install .
      - name: Build full original and English editions
        env:
          PYTHONPATH: src
        run: make release
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
