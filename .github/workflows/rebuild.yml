name: Rebuild from sources

# A clean checkout plus the live upstream downloads must reproduce the committed
# snapshot and the release lock (scripts/verify_rebuild.py). The weekly run also
# notices when an upstream download disappears, while there is time to commit it.
on:
  push:
    branches: [main]
    paths: ["data/**", "src/**", "scripts/**", "website/data/**", "Makefile", "pyproject.toml", ".github/workflows/rebuild.yml"]
  pull_request:
    paths: ["data/**", "src/**", "scripts/**", "website/data/**", "Makefile", "pyproject.toml", ".github/workflows/rebuild.yml"]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grammar-rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned build dependencies
        run: python -m pip install . pytest==9.1.1
      - name: Check the rebuild tooling
        run: python -m pytest -q tests/test_rebuild.py
      - name: Rebuild from the repository and live sources, and compare
        run: python scripts/verify_rebuild.py
